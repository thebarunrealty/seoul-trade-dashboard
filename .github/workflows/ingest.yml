# 데이터 수집 — RTMS 실거래가 API 에서 받아 집계하고 저장소에 반영한다.
#
# 2026-08-13 이관: 그전까지는 이 맥의 launchd(com.kuka.dashboard-ingest)가 돌렸다.
# 맥이 꺼져 있으면 수집이 통째로 멈추는데, 돌지 않은 작업은 실패하지도 않아
# 4주 동안 아무도 몰랐다. 러너로 옮겨 맥의 상태와 무관하게 돌게 한다.
#
# 캐시(.cache/ingest)는 저장소에 있다. 러너가 매번 전량(5,600회) 재수집하지
# 않게 하고, 로컬과 러너가 같은 캐시를 보게 하기 위해서다 — 정본은 origin/main 이다.
# 최근 두 달(직전 완료월 + 당월)은 신고 지연 때문에 ingest.mjs 의 recentYmds 가
# 이미 캐시를 무시하고 다시 받는다. 워크플로가 따로 할 일은 없다.
name: 데이터 수집

# 이 저장소는 공개다. **60일간 활동이 없으면 GitHub 이 스케줄을 자동 비활성화한다.**
# 매주 수집 커밋이 들어오므로 평소에는 걸리지 않지만, 수집이 오래 멈춘 뒤에는
# 워크플로 자체가 꺼져 있을 수 있다 — 되살리려면 Actions 탭에서 이 워크플로를
# 열어 "Enable workflow" 를 누른다. 다시 켜면 실패 알림 수신자가 켠 사람으로 바뀐다.
#
# 실패 알림은 **cron 을 마지막으로 고친 사람**에게 간다. 에이전트가 아래 cron 줄을
# 건드리면 알림이 그쪽으로 새므로, cron 수정은 사람이 직접 한다.
on:
  schedule:
    # 한국시간 월요일 07:00 = UTC 일요일 22:00 (KST = UTC+9, 서머타임 없음).
    # 요일 번호는 0=일요일 (GitHub 문서 기준). 즉 '일요일 22:00 UTC'.
    # 예약 실행은 부하가 몰리면 수 시간 밀릴 수 있다 — freshness.yml 의
    # MAX_AGE_DAYS 가 그 지연을 오경보로 만들지 않게 잡혀 있다.
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      fresh:
        description: '캐시를 무시하고 전량 재수집한다 (API 5,600회 — 평소에는 끄고 둘 것)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  # 마지막 단계의 `gh workflow run pages.yml` 이 이 권한을 쓴다. 없으면 발행 호출이
  # HTTP 403 (Resource not accessible by integration) 로 죽는다 — 2026-08-16·23·31
  # 세 번의 수집이 이것 때문에 실패했다. 수집·병합은 됐는데 발행만 안 돼서
  # 저장소는 최신인데 라이브가 3주 낡은 상태로 남았다.
  actions: write

# 수집이 겹치면 같은 캐시 파일을 양쪽이 고쳐 결과를 알 수 없게 된다.
# 진행 중인 수집은 취소하지 않는다 — 반쯤 쓰인 캐시를 남기지 않기 위해.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          # '22' 는 22.x 최신을 받는다. puppeteer 25.3.0 이 요구하는 node >=22.12.0(package-lock.json)을
          # 이미 만족하므로 '22.12' 로 묶지 않는다('22.12' 는 22.12.x 에 고정돼 보안 업데이트를 놓친다).
          node-version: '22'
      # ingest.mjs 는 의존성이 없다(내장 fetch 만 쓴다). 수집에는 npm ci 가 필요 없다.
      # npm ci 는 아래 품질 게이트 단계에서만 한다(화면·데이터가 바뀐 회차에만).

      # 실패하면 여기서 잡이 끝난다 — 아래 커밋 단계는 돌지 않는다.
      # 키는 Secrets 에서 환경변수로만 넘긴다. 명령줄에 쓰지 않는다(ps 노출 방지).
      # ingest.mjs 는 오류 메시지에 URL 을 넣지 않으므로 키가 로그에 찍히지 않고,
      # GitHub 도 Secrets 값을 로그에서 자동으로 가린다.
      - name: 수집 실행
        env:
          RTMS_SERVICE_KEY: ${{ secrets.RTMS_SERVICE_KEY }}
        run: |
          if [ "${{ inputs.fresh }}" = "true" ]; then
            echo "::warning::전량 재수집 모드 — API 5,600회"
            node dashboard/ingest.mjs --fresh
          else
            node dashboard/ingest.mjs
          fi

      - name: 변경 확인
        id: diff
        run: |
          # data.json 은 gitignored 다. 화면·데이터·캐시 셋만 본다.
          git add dashboard/dashboard.html dashboard/data.js dashboard/.cache/ingest
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음 — 반영할 것이 없다"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "파일 $(git diff --cached --name-only | wc -l | tr -d ' ')개 변경"
            git diff --cached --stat -- dashboard/dashboard.html dashboard/data.js
          fi
          # 위 git add 로 스테이징한 뒤에 판정한다. 캐시만 바뀌고 화면·데이터가
          # 그대로인 회차는 품질 게이트를 건너뛴다.
          if git diff --cached --quiet -- dashboard/dashboard.html dashboard/data.js; then
            echo "needs_verify=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_verify=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 품질 게이트 (병합 전, 같은 잡에서) ─────────────────
      # verify.yml 은 이 워크플로가 GITHUB_TOKEN 으로 연 PR 에서는 실행 승인 대기가
      # 만료돼 돌지 않는다(실행 #43, PR #88). 그래서 병합 전에 여기서 직접 돌린다.
      # 단계 구성은 verify.yml 과 같다. 실패해도 병합은 막지 않는다 — 경고만 남긴다.
      # 준비 단계(npm ci·AppArmor·크롬 확인)도 실패를 허용한다. 크롬 다운로드 같은 일시적
      # 실패로 데이터 병합이 멈추지 않게 하기 위해서다. 준비가 실패하면 검사는
      # 건너뛰고 "준비 실패" 경고를 남긴다.

      # puppeteer 가 postinstall 에서 Chrome for Testing 을 내려받는다.
      # 러너에 크롬이 기본 설치돼 있지 않으므로 이 단계가 곧 크롬 설치다.
      # 다운로드가 걸려도 잡 전체(병합 포함)를 붙잡지 않게 단계 제한 시간을 둔다.
      - name: 의존성 설치 (puppeteer + Chrome)
        id: npm_ci
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.needs_verify == 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: npm ci

      # Ubuntu 23.10+ 는 AppArmor 로 비특권 user namespace 를 막아 크롬 샌드박스가 뜨지 않는다.
      # 제품 코드에 --no-sandbox 를 넣는 대신 러너 쪽 제한을 푼다(verify.yml 과 같은 처리).
      # 실패하면 샌드박스가 뜨지 않으므로 검사를 건너뛰고 준비 실패로 경고한다.
      - name: 크롬 샌드박스 허용 (AppArmor 제한 해제)
        id: apparmor
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.needs_verify == 'true'
        continue-on-error: true
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # puppeteer 25 의 executablePath() 는 Promise 를 반환한다 — await 해야 경로가 나온다.
      # npm ci 가 실패했으면 puppeteer 가 없어 같은 원인으로 또 실패하므로 건너뛴다.
      - name: 크롬 실제 존재 확인
        id: chrome
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.needs_verify == 'true' && steps.npm_ci.outcome == 'success'
        continue-on-error: true
        run: |
          node -e "
          const p = require('puppeteer');
          const fs = require('node:fs');
          (async () => {
            const ep = await p.executablePath();
            console.log('executablePath:', ep);
            fs.accessSync(ep, fs.constants.X_OK);
            console.log('실행 가능 확인 완료');
          })().catch(e => { console.error('크롬 실행파일 확인 실패:', e.message); process.exit(1); });
          "

      # continue-on-error 단계는 실패해도 conclusion 이 success 라서 outcome 으로 본다.
      # 준비 세 단계가 모두 성공했을 때만 돈다.
      - name: 품질 게이트 실행
        id: quality
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.needs_verify == 'true' && steps.npm_ci.outcome == 'success' && steps.apparmor.outcome == 'success' && steps.chrome.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify

      # 검사 대상 회차인데 검사가 건너뛰어졌다 = 준비 단계 중 하나가 성공하지 못했다.
      # 경고 단계는 PR·병합보다 먼저 돈다 — 그래서 문구는 "막지 않는다" 로 쓴다.
      - name: 품질 게이트 준비 실패 경고
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.needs_verify == 'true' && steps.quality.outcome == 'skipped'
        run: |
          FAILED=""
          for pair in "의존성 설치 (puppeteer + Chrome)=${{ steps.npm_ci.outcome }}" \
                      "크롬 샌드박스 허용 (AppArmor 제한 해제)=${{ steps.apparmor.outcome }}" \
                      "크롬 실제 존재 확인=${{ steps.chrome.outcome }}"; do
            case "${pair##*=}" in
              failure|cancelled) FAILED="${FAILED:+$FAILED, }${pair%=*}(${pair##*=})" ;;
            esac
          done
          echo "::warning title=품질 게이트 준비 실패::'$FAILED' 단계가 실패해 npm run verify 를 실행하지 못했다 — 병합은 막지 않는다(경고만)"
          {
            echo "### ⚠️ 품질 게이트를 실행하지 못함"
            echo "- 실패한 준비 단계: $FAILED — 병합은 막지 않는다(경고만)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 품질 게이트 실패 경고
        if: steps.quality.outcome == 'failure' || steps.quality.outcome == 'cancelled'
        run: |
          echo "::warning title=품질 게이트 실패::npm run verify 실패(${{ steps.quality.outcome }}) — 병합은 막지 않는다(경고만). '품질 게이트 실행' 단계 로그를 확인하라"
          {
            echo "### ⚠️ 품질 게이트 실패"
            echo "- npm run verify 실패(${{ steps.quality.outcome }}) — 병합은 막지 않는다(경고만). '품질 게이트 실행' 단계 로그 확인"
          } >> "$GITHUB_STEP_SUMMARY"

      # main 은 ruleset 으로 보호돼 있어 PR 없이는 push 할 수 없고,
      # GITHUB_TOKEN 은 bypass 대상(Repository admin)이 아니다.
      # 그렇다고 Actions 를 bypass 에 넣으면 @claude 에이전트도 main 에 직접
      # push 할 수 있게 된다. 그래서 보호는 그대로 두고 규칙대로 PR 로 들어간다.
      # 요구 승인이 0건이라 승인 없이 병합된다.
      - name: PR 로 반영
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="ingest/$(date -u +%Y%m%d-%H%M%S)"
          DATE=$(grep -oE '"generatedAt"[[:space:]]*:[[:space:]]*"[0-9]{4}-[0-9]{2}-[0-9]{2}' \
                   dashboard/data.js | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          [ -n "$DATE" ] || { echo "generatedAt 추출 실패 — data.js 확인"; exit 1; }

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git commit -m "data: 수집 $DATE" \
                     -m "GitHub Actions 자동 수집 (실행 ${{ github.run_id }})."
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "data: 수집 $DATE" \
            --body "$(printf '%s\n' \
              '자동 수집 결과다. 요구 승인이 0건이라 승인 없이 병합된다.' \
              '' \
              '병합되면 `pages.yml` 이 `dashboard.html`·`data.js` 두 개만 발행한다.' \
              '' \
              "실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"

          # squash 로 합쳐 main 이력에 수집 커밋 하나만 남긴다.
          gh pr merge "$BRANCH" --squash --delete-branch

          # GITHUB_TOKEN 이 만든 push 로는 다른 워크플로가 트리거되지 않는다.
          # 즉 병합만으로는 후속 워크플로가 돌지 않는다(실측 확인, 2026-08-13).
          # 리포트 생성(report.yml)을 직접 부른다 — 그쪽이 PNG 를 만들어 커밋한 뒤
          # 발행(pages.yml)까지 부른다(2026-09-04 체인 연결). 수집이 성공하고 실제로
          # 데이터가 바뀐 경우에만 여기까지 오므로, 리포트·발행은 수집 성공에 종속된다.
          gh workflow run report.yml --ref main
          echo "리포트 생성(report.yml) 요청 완료 — 발행은 그쪽에서 이어진다"

      - name: 결과
        if: always()
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "false" ]; then
            echo "수집은 됐으나 바뀐 데이터가 없다 — 발행하지 않는다"
          fi
          PREP=" ${{ steps.npm_ci.outcome }} ${{ steps.apparmor.outcome }} ${{ steps.chrome.outcome }} "
          case "${{ steps.quality.outcome }}" in
            success) V="통과" ;;
            failure|cancelled) V="실패(경고만, 병합은 막지 않음)" ;;
            *) case "$PREP" in
                 *" failure "*|*" cancelled "*) V="준비 실패로 미실행(경고만, 병합은 막지 않음)" ;;
                 *) V="건너뜀" ;;
               esac ;;
          esac
          echo "품질 게이트: $V"
