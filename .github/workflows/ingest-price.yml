# 가격 수집 — 한국부동산원 R-ONE 주간 아파트 매매가격지수를 받아 캐시를 갱신한다.
#
# 2026-10-01 신설. 대시보드에 거래 "건수"만 있고 "가격"이 없어서 붙였다.
#
# ── 왜 한 주에 세 번 도는가 ──────────────────────────
# 발표는 목요일 14시 KST 지만, 발표가 늦거나 GitHub 예약 실행이 밀리는 일이 있다
# (이 저장소의 신선도 감시도 00:00 UTC 예약이 03:02 UTC 에 돈 적이 있다).
# 한 번만 돌면 그 주 값을 통째로 놓치고 다음 주까지 묵은 값이 나간다.
# 그래서 발표 뒤 세 번 돌린다. **이미 받았거나 아직 발표 전이면 아무것도 바꾸지
# 않고 정상 종료한다** — 실패가 아니다. 수집기(collectPrice)가 캐시의 주차와
# 비교해 판정하므로 몇 번을 돌려도 결과가 같다.
#
# ── 화면 반영 시점 ───────────────────────────────────
# 2026-10-09 변경. 그전까지는 **캐시만** 갱신하고 화면·리포트 반영은 다음 월요일
# ingest.yml 에 맡겼다. 그래서 목·금에 주간 뉴스를 만들면 ⑥ 가격이 늘 한 주 전
# 조사분이었다 — 목요일에 받아 둔 그 주 값이 캐시에만 있고 그림에는 없었다.
#
# 이제 캐시가 바뀌면 같은 실행에서 **⑥ 가격만** data.js 에 다시 넣고
# (`ingest.mjs --price-only`) 리포트를 다시 그린다. 바뀌는 것은 06 뿐이다.
#   · 거래량(①②③·추이)과 generatedAt 은 손대지 않는다 — RTMS 를 부르지 않으므로
#     주중에 거래 건수가 흔들릴 일이 없다. 그래서 ingest.yml 전체를 부르지 않는다.
#   · 01~05 그림도 그대로다. 데이터가 같으면 PNG 가 바이트까지 같아 커밋에 안 잡힌다.
#   · 그림은 **그 주 월요일 날짜 폴더**(reports/<generatedAt>/06.png)와 latest/06.png
#     를 덮어쓴다. 폴더 이름은 거래량 수집일이라 가격만 바뀐 것은
#     manifest.json 의 price.asOf 가 알린다(date 는 그대로, asOf 만 그 주 조사일로).
#
# 정비사업(ingest-rebuild.yml)은 여전히 캐시만 갱신한다 — 그쪽은 월 1회라
# 주중에 급할 일이 없다.
name: 가격 수집

on:
  schedule:
    # KST = UTC+9, 서머타임 없음. 발표가 목요일 14:00 KST 다.
    #   목 15:00 KST = 목 06:00 UTC  — 발표 직후 첫 시도
    #   목 21:00 KST = 목 12:00 UTC  — 발표가 늦어졌을 때
    #   금 09:00 KST = 금 00:00 UTC  — 예약 실행이 밀렸을 때 마지막 그물
    #
    # 실패 알림은 cron 을 마지막으로 고친 사람에게 간다 — 수정은 사람이 직접 한다.
    - cron: '0 6 * * 4'
    - cron: '0 12 * * 4'
    - cron: '0 0 * * 5'
  workflow_dispatch:
    inputs:
      force:
        description: '이미 받은 주차도 다시 받아 캐시를 덮어쓴다'
        required: false
        default: false
        type: boolean

# 권한은 잡마다 따로 준다. 의존성 코드(npm ci·puppeteer)를 쓰기 토큰이나 시크릿이 있는
# VM 에서 돌리지 않기 위해 수집(contents: write)·검사(read)·병합(PR·actions write)
# 잡 3개로 나눴다. 워크플로 단위 기본 권한은 비워 둔다.
permissions: {}

# 같은 주에 여러 번 도는 워크플로다. 겹쳐 돌면 캐시 파일을 두 실행이 다툰다.
concurrency:
  group: ingest-price
  cancel-in-progress: false

jobs:
  # ── 1. 수집 잡: 시크릿과 contents: write. npm 의존성은 설치하지 않는다 ──
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      needs_verify: ${{ steps.diff.outputs.needs_verify }}
      branch: ${{ steps.push.outputs.branch }}
      sha: ${{ steps.push.outputs.sha }}
      asof: ${{ steps.push.outputs.asof }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          # '22' 는 22.x 최신을 받는다. puppeteer 25.3.0 이 요구하는 node >=22.12.0(package-lock.json)을
          # 이미 만족하므로 '22.12' 로 묶지 않는다('22.12' 는 22.12.x 에 고정돼 보안 업데이트를 놓친다).
          node-version: '22'
      # ingest-price.mjs 는 의존성이 없다(내장 fetch 만 쓴다). 이 잡은 npm ci 를 하지 않는다.
      # npm ci·검사는 읽기 권한만 가진 verify 잡에서 한다(화면·데이터가 바뀐 회차에만).

      - name: 수집 실행
        id: collect
        env:
          REB_SERVICE_KEY: ${{ secrets.REB_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${REB_SERVICE_KEY}" ]; then
            echo "::error::REB_SERVICE_KEY 시크릿이 없다 — Settings > Secrets > Actions 에 등록하라"
            exit 1
          fi
          ARGS=""
          [ "${{ inputs.force }}" = "true" ] && ARGS="--force"
          # 출력을 요약에 그대로 싣는다. "수집 완료 / 발표 전" 문구가 여기 찍힌다.
          node dashboard/ingest-price.mjs $ARGS | tee /tmp/price.log

      # ⑥ 가격만 data.js 에 다시 넣는다. **캐시가 바뀌었는지와 무관하게 늘 돌린다.**
      #
      # 조건을 걸지 않는 이유가 둘 있다.
      #   1) 자기 치유. 지난 회차가 캐시는 병합하고 주입 단계에서 죽었다면, 조건을
      #      걸면 캐시가 더 바뀌지 않는 한 영영 다시 잡히지 않는다. 캐시와 data.js 가
      #      어긋난 채 남고 그 사이 report.yml 은 verify-report 의 [가격] 캐시 대조에
      #      걸려 계속 실패한다. 늘 돌리면 다음 회차가 알아서 메운다.
      #   2) 수동 실행이 쓸모가 있어야 한다. 이미 받아 둔 주차를 화면에 밀어 넣는
      #      것이 사람이 이 워크플로를 손으로 돌리는 주된 이유다.
      #
      # 공짜다 — API 를 부르지 않고 커밋된 가격 캐시만 읽는다(refreshPriceOnly 는
      # 동기 함수라 네트워크를 탈 수 없다). 그래서 RTMS_SERVICE_KEY 도 넘기지 않는다.
      # 멱등하다: 캐시 주차가 data.js 에 이미 실린 주차와 같으면 아무것도 쓰지 않는다.
      - name: 화면 반영 (⑥ 가격만)
        run: |
          set -euo pipefail
          # ingest.mjs 는 의존성이 없다 — node_modules 없이 npm run 만으로 돈다
          # (package.json 의 스크립트만 실행한다). npm ci 는 verify 잡에서만 한다.
          npm run price-only | tee /tmp/price-inject.log

      # 캐시와 화면을 **한 번에** 본다. 캐시만 보면 "캐시는 그대로인데 화면이 밀려
      # 있던" 회차를 놓친다(위 자기 치유의 반쪽). data.json 은 gitignored 다.
      - name: 변경 확인
        id: diff
        run: |
          git add dashboard/.cache/price dashboard/data.js dashboard/dashboard.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "바뀐 것 없음 — 이미 받아 화면에도 실렸거나 아직 발표 전이다. 정상 종료한다"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "파일 $(git diff --cached --name-only | wc -l | tr -d ' ')개 변경"
            git diff --cached --name-only | sed 's/^/  /'
          fi
          # 위 git add 로 스테이징한 뒤에 판정한다. 캐시만 바뀌고 화면·데이터가
          # 그대로인 회차는 품질 게이트를 건너뛴다.
          if git diff --cached --quiet -- dashboard/dashboard.html dashboard/data.js; then
            echo "needs_verify=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_verify=true" >> "$GITHUB_OUTPUT"
          fi

      # main 은 ruleset 보호라 PR 로 들어간다 — 다른 수집 워크플로와 같은 경로.
      # 캐시와 data.js 를 **한 PR 로** 넣는다. 둘을 나누면 캐시만 병합된 채
      # data.js 주입이 빠지는 창이 생기고, 그 사이에 report.yml 이 돌면
      # verify-report 의 [가격] 캐시 대조 검사에 걸려 리포트가 실패한다.
      # 이 잡은 브랜치를 만들어 push 까지만 한다. PR 생성·병합은 merge 잡이 하고,
      # 그 사이 verify 잡이 이 커밋(sha)을 읽기 권한으로 검사한다.
      - name: 브랜치로 push
        id: push
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          ASOF=$(node -e "
            const fs=require('node:fs'), dir='dashboard/.cache/price';
            const f=fs.readdirSync(dir).filter(x=>/^[0-9]{6}\.json$/.test(x)).sort().pop();
            process.stdout.write(JSON.parse(fs.readFileSync(dir+'/'+f,'utf8')).asOf);
          ")
          [ -n "$ASOF" ] || { echo "::error::캐시에서 기준일을 읽지 못했다"; exit 1; }
          BRANCH="price/$(date -u +%Y%m%d-%H%M%S)"

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git commit -m "data: 가격 수집 ${ASOF} 기준" \
                     -m "한국부동산원 주간 아파트 매매가격지수. GitHub Actions 자동 수집 (실행 ${{ github.run_id }}). 캐시 + ⑥ 가격만 반영한 data.js. 거래량과 generatedAt 은 건드리지 않았다."
          git push origin "$BRANCH"
          {
            echo "branch=$BRANCH"
            echo "sha=$(git rev-parse HEAD)"
            echo "asof=$ASOF"
          } >> "$GITHUB_OUTPUT"

      # 가격 로그(/tmp/*.log)는 이 VM 에만 있으므로 수집 요약은 이 잡에서 쓴다.
      # 품질 게이트 결과 줄은 merge 잡의 요약에 나온다.
      - name: 결과 요약
        if: always()
        run: |
          {
            echo "### 가격 수집"
            echo ""
            sed -n 's/^\[ingest-price\] //p' /tmp/price.log 2>/dev/null | sed 's/^/- /'
            sed -n 's/^\[ingest\] //p' /tmp/price-inject.log 2>/dev/null | sed 's/^/- /'
            echo ""
            echo "- 캐시 변경: **${{ steps.diff.outputs.changed || 'false' }}**"
            echo "- 바뀌는 그림: **06 (가격) 하나** — 01~05 와 거래량 숫자는 그대로"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 2. 검사 잡: 읽기 권한만. 의존성 코드(npm ci·puppeteer)는 이 잡에서만 돈다 ──
  # verify.yml 은 수집 워크플로가 GITHUB_TOKEN 으로 연 PR 에서는 실행 승인 대기가
  # 만료돼 돌지 않는다(실행 #43, PR #88). 그래서 병합 전에 이 잡이 직접 검사한다.
  # 쓰기 토큰·시크릿이 있는 수집 VM 에서 의존성 코드를 돌리지 않으려고 잡을 나눴다.
  # 단계 구성은 verify.yml 과 같다. 실패해도 병합은 막지 않는다 — 경고만 남긴다.
  # 준비 단계(npm ci·AppArmor·크롬 확인)도 실패를 허용한다. 크롬 다운로드 같은 일시적
  # 실패로 데이터 병합이 멈추지 않게 하기 위해서다. 준비가 실패하면 검사는
  # 건너뛰고 "준비 실패" 경고를 남긴다.
  verify:
    needs: price
    if: needs.price.outputs.changed == 'true' && needs.price.outputs.needs_verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      # 수집 잡이 push 한 커밋을 그대로 검사한다. 토큰을 .git 설정에 남기지 않는다.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.price.outputs.sha }}
          persist-credentials: false

      # 수집 잡과 같은 '22'(22.x 최신 — puppeteer 의 node >=22.12.0 충족). npm 캐시는 쓰지 않는다.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # puppeteer 가 postinstall 에서 Chrome for Testing 을 내려받는다.
      # 러너에 크롬이 기본 설치돼 있지 않으므로 이 단계가 곧 크롬 설치다.
      # 다운로드가 걸려도 병합을 붙잡지 않게 단계 제한 시간을 둔다.
      - name: 의존성 설치 (puppeteer + Chrome)
        id: npm_ci
        continue-on-error: true
        timeout-minutes: 8
        run: npm ci

      # Ubuntu 23.10+ 는 AppArmor 로 비특권 user namespace 를 막아 크롬 샌드박스가 뜨지 않는다.
      # 제품 코드에 --no-sandbox 를 넣는 대신 러너 쪽 제한을 푼다(verify.yml 과 같은 처리).
      # 실패하면 샌드박스가 뜨지 않으므로 검사를 건너뛰고 준비 실패로 경고한다.
      - name: 크롬 샌드박스 허용 (AppArmor 제한 해제)
        id: apparmor
        continue-on-error: true
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # puppeteer 25 의 executablePath() 는 Promise 를 반환한다 — await 해야 경로가 나온다.
      # npm ci 가 실패했으면 puppeteer 가 없어 같은 원인으로 또 실패하므로 건너뛴다.
      - name: 크롬 실제 존재 확인
        id: chrome
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        run: |
          node -e "
          const p = require('puppeteer');
          const fs = require('node:fs');
          (async () => {
            const ep = await p.executablePath();
            console.log('executablePath:', ep);
            fs.accessSync(ep, fs.constants.X_OK);
            console.log('실행 가능 확인 완료');
          })().catch(e => { console.error('크롬 실행파일 확인 실패:', e.message); process.exit(1); });
          "

      # continue-on-error 단계는 실패해도 conclusion 이 success 라서 outcome 으로 본다.
      # 준비 세 단계가 모두 성공했을 때만 돈다.
      - name: 품질 게이트 실행
        id: quality
        if: steps.npm_ci.outcome == 'success' && steps.apparmor.outcome == 'success' && steps.chrome.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify

      # 검사가 건너뛰어졌다 = 준비 단계 중 하나가 성공하지 못했다(잡 조건상 검사 대상 회차다).
      # 이 잡은 merge 잡보다 먼저 끝난다 — 그래서 문구는 "막지 않는다" 로 쓴다.
      - name: 품질 게이트 준비 실패 경고
        if: steps.quality.outcome == 'skipped'
        run: |
          FAILED=""
          for pair in "의존성 설치 (puppeteer + Chrome)=${{ steps.npm_ci.outcome }}" \
                      "크롬 샌드박스 허용 (AppArmor 제한 해제)=${{ steps.apparmor.outcome }}" \
                      "크롬 실제 존재 확인=${{ steps.chrome.outcome }}"; do
            case "${pair##*=}" in
              failure|cancelled) FAILED="${FAILED:+$FAILED, }${pair%=*}(${pair##*=})" ;;
            esac
          done
          echo "::warning title=품질 게이트 준비 실패::'$FAILED' 단계가 실패해 npm run verify 를 실행하지 못했다 — 병합은 막지 않는다(경고만)"
          {
            echo "### ⚠️ 품질 게이트를 실행하지 못함"
            echo "- 실패한 준비 단계: $FAILED — 병합은 막지 않는다(경고만)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 품질 게이트 실패 경고
        if: steps.quality.outcome == 'failure' || steps.quality.outcome == 'cancelled'
        run: |
          echo "::warning title=품질 게이트 실패::npm run verify 실패(${{ steps.quality.outcome }}) — 병합은 막지 않는다(경고만). '품질 게이트 실행' 단계 로그를 확인하라"
          {
            echo "### ⚠️ 품질 게이트 실패"
            echo "- npm run verify 실패(${{ steps.quality.outcome }}) — 병합은 막지 않는다(경고만). '품질 게이트 실행' 단계 로그 확인"
          } >> "$GITHUB_STEP_SUMMARY"

      # merge 잡이 결과 줄을 쓰도록 판정을 잡 출력으로 넘긴다: 통과 / 실패 / 준비실패.
      - name: 판정
        id: verdict
        if: always()
        run: |
          PREP=" ${{ steps.npm_ci.outcome }} ${{ steps.apparmor.outcome }} ${{ steps.chrome.outcome }} "
          case "${{ steps.quality.outcome }}" in
            success) V="통과" ;;
            failure|cancelled) V="실패" ;;
            *) case "$PREP" in
                 *" failure "*|*" cancelled "*) V="준비실패" ;;
                 *) V="" ;;
               esac ;;
          esac
          echo "verdict=$V" >> "$GITHUB_OUTPUT"
          echo "판정: ${V:-(없음)}"

  # ── 3. 병합 잡: PR·actions 쓰기 권한. 체크아웃도 npm 도 하지 않는다 ──
  # 검사가 실패하거나 건너뛰어져도 돈다(!cancelled()) — 경고만 남기고 병합은 막지 않는다.
  merge:
    needs: [price, verify]
    if: ${{ !cancelled() && needs.price.result == 'success' && needs.price.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # 마지막의 `gh workflow run report.yml` 이 이 권한을 쓴다. 없으면 호출이
      # HTTP 403 (Resource not accessible by integration) 으로 죽는다 — ingest.yml 과 같은 이유.
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ needs.price.outputs.branch }}
      SHA: ${{ needs.price.outputs.sha }}
      ASOF: ${{ needs.price.outputs.asof }}
    steps:
      # 아래 gh pr merge --match-head-commit 지원 여부를 로그로 남긴다.
      - name: gh 버전
        run: gh --version

      - name: PR 로 반영
        run: |
          set -euo pipefail
          [ -n "$BRANCH" ] && [ -n "$SHA" ] && [ -n "$ASOF" ] \
            || { echo "::error::수집 잡 출력(branch·sha·asof)이 비어 있다"; exit 1; }

          gh pr create --base main --head "$BRANCH" \
            --title "data: 가격 수집 ${ASOF} 기준" \
            --body "$(printf '%s\n' \
              '한국부동산원 주간 아파트 매매가격지수 캐시를 갱신하고, ⑥ 가격만 `data.js` 에 다시 넣었다. 요구 승인이 0건이라 승인 없이 병합된다.' \
              '' \
              '거래량(①②③·추이)과 `generatedAt` 은 그대로다 — RTMS 를 부르지 않았다.' \
              '' \
              '병합 뒤 `report.yml` 을 불러 06번 그림을 다시 그리고 발행까지 이어 간다.' \
              '' \
              "실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"

          # 수집 잡이 push 하고 verify 잡이 검사한 그 커밋일 때만 병합한다.
          gh pr merge "$BRANCH" --squash --delete-branch --match-head-commit "$SHA"

          # GITHUB_TOKEN 의 병합은 push 트리거를 발동시키지 않으므로 직접 부른다
          # (ingest.yml 과 같은 경로). report.yml 이 검증·렌더·커밋을 하고 발행까지
          # 이어 간다 — verify-report 가 실패하면 그림도 발행도 나가지 않는다.
          gh workflow run report.yml --ref main
          echo "리포트 생성(report.yml) 요청 완료 — 06번만 바뀐다"

      # 품질 게이트 결과 한 줄. verify 잡이 건너뛰어졌거나(캐시만 바뀐 회차) 판정 전에
      # 끝났으면(체크아웃 실패·잡 시간 초과) 잡 결과로 판정한다.
      - name: 결과 (품질 게이트)
        if: always()
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          VERDICT: ${{ needs.verify.outputs.verdict }}
        run: |
          case "$VERDICT" in
            통과) V="통과" ;;
            실패) V="실패(경고만, 병합은 막지 않음)" ;;
            준비실패) V="준비 실패로 미실행(경고만, 병합은 막지 않음)" ;;
            *) case "$VERIFY_RESULT" in
                 failure|cancelled) V="준비 실패 또는 시간 초과로 미실행(경고만, 병합은 막지 않음)" ;;
                 *) V="건너뜀" ;;
               esac ;;
          esac
          echo "품질 게이트: $V"
          echo "- 품질 게이트: **$V**" >> "$GITHUB_STEP_SUMMARY"
